# rgcrprod.azurecr.us (the chart default) needs credentials we do not hold, so
# every stigatron pod sat in ImagePullBackOff with a 401. The same images are in
# the Carbide registry, which the nodes already authenticate to through the
# carbide-registry-auth secret wired up in clusters/aws/values.yaml.
#
# Carbide does not mirror every tag the chart defaults to, so the three that are
# missing there are pinned forward to the ones it does carry: the operators to
# 0.4.2 (chart default 0.4.0) and postgres to 13 (chart default 13.1). Verify
# before bumping the chart again:
#   curl -u USER:PASS "https://registry.ranchercarbide.dev/service/token\
#?service=harbor-registry&scope=repository:carbide/<repo>:pull"
#   curl -H "Authorization: Bearer <token>" \
#     https://registry.ranchercarbide.dev/v2/carbide/<repo>/tags/list
global:
  cattle:
    systemDefaultRegistry: "registry.ranchercarbide.dev"

complianceOperator:
  image:
    name: carbide/compliance-operator
    tag: "0.4.2"
  imagePullPolicy: IfNotPresent
  serviceAccountName: stigatron
heimdallOperator:
  image:
    name: carbide/heimdall-operator
    tag: "0.4.2"
  imagePullPolicy: IfNotPresent
  serviceAccountName: stigatron
  database:
    port: "5432"
    name: heimdall
    user: postgres
    password: password
    sslMode: false
hook:
  image:
    name: carbide/stigatron-hook
    tag: "0.2.0"
  imagePullPolicy: IfNotPresent
rbac:
  roleName: compliance-operator
  roleBindingName: compliance-operator
alert:
  enabled: false
heimdall2:
  databasePort: 5432
  databaseName: heimdall
  jwtSecret: abcde12345
  heimdall:
    rcidf:
      name: carbide/rcidf
      tag: "0.1.2"
    image:
      name: carbide/heimdall2
      tag: "0.1.1"
  postgres:
    enabled: true
    user: postgres
    password: password
    image:
      name: carbide/heimdall-postgres
      tag: "13"
    persistence:
      enabled: false
