defaultNamespace: longhorn-system
labels:
  longhorn-stage: crds
helm:
  releaseName: longhorn-crd
  repo: https://charts.rancher.io
  chart: longhorn-crd
  version: 110.1.0+up1.12.1

# The rancher-charts longhorn chart does not template its CRDs the way the
# upstream chart did; it ships validate-install-crd.yaml and expects them from
# this chart, so this bundle has to land first.
#
# CRDs must not be drift-corrected. Correction is a helm rollback, and rolling
# a CRD back can take its stored versions with it; the API server also writes
# /status on every CustomResourceDefinition, which Fleet would otherwise read as
# drift forever. Ignore that status instead.
correctDrift:
  enabled: false
diff:
  comparePatches:
  - apiVersion: apiextensions.k8s.io/v1
    kind: CustomResourceDefinition
    operations:
    - {"op": "remove", "path": "/status"}
