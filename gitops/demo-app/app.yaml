---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cowsay
  namespace: default
  labels:
    app: demo
spec:
  replicas: 5
  selector:
    matchLabels:
      app: demo
  template:
    metadata:
      labels:
        app: demo
    spec:
      containers:
      - env:
        - name: COW_COLOR
          value: blue
        name: demo
        image: brooksphilip/rancher-demo-navlink
        ports:
        - containerPort: 8080
        # The cluster runs the CIS profile, which sets a cluster-wide
        # PodSecurity default of enforce=restricted. The default namespace is
        # not on the exemption list, so without this block the ReplicaSet is
        # rejected outright and the bundle never becomes Ready. This image
        # serves on 8080 and needs nothing privileged, so it just complies.
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 1000
          capabilities:
            drop:
            - ALL
          seccompProfile:
            type: RuntimeDefault

---
apiVersion: v1
kind: Service
metadata:
  name: cowsay
  namespace: default
spec:
  selector:
    app: demo
  ports:
  - name: http
    port: 8080
    protocol: TCP
    targetPort: 8080

---
apiVersion: ui.cattle.io/v1
kind: NavLink
metadata:
  name: rodeo
spec:
  target: _blank
  toService:
    name: cowsay
    namespace: default
    path: /
    port: '8080'
    scheme: http