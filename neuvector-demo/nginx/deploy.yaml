---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nmap
  labels:
    app: nmap
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nmap
  template:
    metadata:
      labels:
        app: nmap
    spec:
      containers:
      - name: nmap
        image: brooksphilip/neuvector-nmap
