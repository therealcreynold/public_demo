# Default values for ..
# This is a YAML-formatted file.
# Declare variables to be passed into your templates.
global:
  cattle:
    # rgcrprod.azurecr.us needs credentials we do not hold, so every docs pod
    # sat in ImagePullBackOff. All twelve carbide/*-docs images are also in the
    # Carbide registry, which the nodes already authenticate to through the
    # carbide-registry-auth secret wired up in clusters/aws/values.yaml, so no
    # imagePullSecret is needed here.
    systemDefaultRegistry: "registry.ranchercarbide.dev"

defaults:
  containerPort: 8080
  uid: 65532
  image:
    tag: "0.1.8"

docs:
  kubernetes:
    enabled: true
    image:
      name: "carbide/kubernetes-cncf-docs"
      # tag: "0.1.1"
  rancher:
    enabled: true
    image:
      name: "carbide/rancher-docs"
      # tag: "0.1.1"
  rke2:
    enabled: true
    image:
      name: "carbide/rke2-docs"
      # tag: "0.1.1"
  k3s:
    enabled: true
    image:
      name: "carbide/k3s-docs"
      # tag: "0.1.1"
  neuvector:
    enabled: true
    image:
      name: "carbide/neuvector-docs"
      # tag: "0.1.1"
  fleet:
    enabled: true
    image:
      name: "carbide/fleet-docs"
      # tag: "0.1.1"
  longhorn:
    enabled: true
    image:
      name: "carbide/longhorn-docs"
      # tag: "0.1.1"
  kubewarden:
    enabled: true
    image:
      name: "carbide/kubewarden-docs"
      # tag: "0.1.1"
  carbide:
    enabled: true
    image:
      name: "carbide/carbide-docs"
      # tag: "0.1.1"
  elemental:
    enabled: true
    image:
      name: "carbide/elemental-docs"
      # tag: "0.1.1"
  harvester:
    enabled: true
    image:
      name: "carbide/harvester-docs"
      # tag: "0.1.1"
  rancherdesktop:
    enabled: true
    image:
      name: "carbide/rancher-desktop-docs"
      # tag: "0.1.1"
  # Chart 0.1.56 adds this one enabled by default, but it is not a docs image:
  # neuvector/vdb-explorer serves a NeuVector vulnerability database and exits 1
  # with "unable to open database file" because nothing mounts a
  # /var/lib/vuldb/vuldb.sqlite. It has been CrashLoopBackOff on the Rancher
  # cluster for 181 days for the same reason. One broken pod would hold this
  # bundle NotReady forever, so leave it off until the chart ships a volume.
  neuvectorvdbexplorer:
    enabled: false
